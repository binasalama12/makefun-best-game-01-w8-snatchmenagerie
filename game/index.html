<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SNATCHMENAGERIE — buy, park, snatch: 8 creature lines, 8 rival vaults, 6 traps, 9 rungs, final vault The Collector</title>
<style>
  html, body { margin: 0; padding: 0; background: #0b0714; height: 100%; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; font-family: Georgia, 'Times New Roman', serif; }
  #stage { position: relative; width: 1280px; height: 720px; max-width: 100vw; max-height: 100vh; }
  canvas { display: block; width: 1280px; height: 720px; background: #120a24; cursor: pointer; }
  #hud {
    position: absolute; left: 0; right: 0; top: 0; height: 46px;
    display: flex; align-items: center; gap: 20px; padding: 0 18px;
    color: #ffe9b8; font-size: 16px; letter-spacing: .04em;
    background: linear-gradient(180deg, rgba(8,4,20,.9), rgba(8,4,20,.55) 70%, rgba(8,4,20,0));
    pointer-events: none; text-shadow: 0 1px 3px #000;
  }
  #hud .lab { color: #c9a8ff; font-size: 11px; text-transform: uppercase; letter-spacing: .18em; margin-right: 6px; }
  #hud .val { font-weight: bold; }
  #lockwrap { flex: 0 0 170px; height: 10px; border: 1px solid #8a6fd0; border-radius: 5px; background: rgba(24,14,52,.8); overflow: hidden; }
  #lockbar { height: 100%; width: 100%; background: linear-gradient(90deg, #ffb347, #ff5a7a); transition: width .2s; }
  #msg {
    position: absolute; left: 0; right: 0; bottom: 10px; text-align: center;
    color: #ffe9b8; font-size: 16px; pointer-events: none; text-shadow: 0 1px 4px #000;
  }
</style>
</head>
<body>
<div id="stage">
  <canvas id="game" width="1280" height="720"></canvas>
  <div id="hud">
    <span><span class="lab">Rung</span><span class="val" id="h-rung">–</span></span>
    <span><span class="lab">Coins</span><span class="val" id="h-coins">0</span></span>
    <span><span class="lab">Income</span><span class="val" id="h-income">0/s</span></span>
    <span><span class="lab">Score</span><span class="val" id="h-score">0</span></span>
    <span><span class="lab">Combo</span><span class="val" id="h-combo">×1</span></span>
    <span><span class="lab">Vault lock</span></span><span id="lockwrap"><span id="lockbar"></span></span>
    <span><span class="lab">Phase</span><span class="val" id="h-phase">–</span></span>
  </div>
  <div id="msg"></div>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
